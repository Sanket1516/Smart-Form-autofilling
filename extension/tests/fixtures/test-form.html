<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form Fixture</title>
</head>
<body>
  <h1>Test Form</h1>
  <form id="test-form">
    <div>
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" required />
    </div>
    
    <div>
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" required />
    </div>

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div>
      <label for="ssn">SSN</label>
      <input type="password" id="ssn" name="ssn" />
    </div>

    <div>
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select a country</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
      </select>
    </div>

    <!-- Hidden field that appears later -->
    <div id="dynamic-container" style="display: none;">
      <label for="dynamic-field">Dynamic Field</label>
      <input type="text" id="dynamic-field" name="dynamic-field" />
    </div>

    <button type="button" id="show-dynamic">Show Dynamic Field</button>
    
    <button type="submit" id="submit-btn">Submit</button>
  </form>

  <script>
    document.getElementById('show-dynamic').addEventListener('click', () => {
      document.getElementById('dynamic-container').style.display = 'block';
    });

    document.getElementById('test-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Emulate submit
      document.body.classList.add('submitted');
    });
  </script>
</body>
</html>
