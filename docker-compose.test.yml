services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-smart_form}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-local_development_only}
    ports:
      - "27017:27017"
    volumes:
      - test_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval ''db.adminCommand("ping").ok'' | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [smart-form-internal]

  chromadb:
    image: chromadb/chroma
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    volumes:
      - test_chromadb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [smart-form-internal]

  redis:
    image: redis:7-alpine
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  backend:
    build:
      context: ./backend
      target: ${BACKEND_BUILD_TARGET:-prod}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Smart Form Auto-Filling System}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_form_db}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-smart_form}:${MONGODB_ROOT_PASSWORD:-local_development_only}@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: ${CHROMADB_COLLECTION:-user_document_chunks}
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-2}
      LLM_PROVIDER: mock-e2e
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_before_enabling_authentication}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: ${AUTH_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,chrome-extension://*}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-chrome-extension://[a-p]{32}}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      HIGH_CONFIDENCE_THRESHOLD: ${HIGH_CONFIDENCE_THRESHOLD:-0.90}
      MEDIUM_CONFIDENCE_THRESHOLD: ${MEDIUM_CONFIDENCE_THRESHOLD:-0.70}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/uploads}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      EXTRACTION_MIN_CONFIDENCE: ${EXTRACTION_MIN_CONFIDENCE:-0.50}
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.50}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      LLM_REASONING_TIMEOUT_SECONDS: ${LLM_REASONING_TIMEOUT_SECONDS:-30}
      LLM_MAX_EVIDENCE_CHUNKS: ${LLM_MAX_EVIDENCE_CHUNKS:-5}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.85}
      SENSITIVE_FIELD_CONCEPTS: ${SENSITIVE_FIELD_CONCEPTS:-ssn,credit_card,passport_number,password}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - test_document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [smart-form-internal]

  worker:
    build:
      context: ./backend
      target: ${BACKEND_BUILD_TARGET:-prod}
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_form_db}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-smart_form}:${MONGODB_ROOT_PASSWORD:-local_development_only}@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/uploads}
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      EXTRACTION_MIN_CONFIDENCE: ${EXTRACTION_MIN_CONFIDENCE:-0.50}
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: ${CHROMADB_COLLECTION:-user_document_chunks}
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-2}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
    volumes:
      - test_document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smart-form-internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  extension-builder:
    build:
      context: ./extension
    volumes:
      - ./extension/dist:/app/dist

networks:
  smart-form-internal:
    driver: bridge

volumes:
  test_mongodb_data:
  test_chromadb_data:
  test_redis_data:
  test_document_data:
