name: smart-form-autofilling-test

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: smart_form_test
      MONGO_INITDB_ROOT_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:${TEST_MONGODB_PORT:-27018}:27017"
    volumes:
      - test_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval ''db.adminCommand("ping").ok'' | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [smart-form-internal]

  chromadb:
    image: chromadb/chroma
    ports:
      - "127.0.0.1:${TEST_CHROMADB_PORT:-8002}:8000"
    volumes:
      - test_chromadb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [smart-form-internal]

  redis:
    image: redis:7-alpine
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      APP_ENV: test
      APP_NAME: ${APP_NAME:-Smart Form Auto-Filling System}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_DATABASE: smart_form_test
      MONGODB_URL: mongodb://smart_form_test:local_test_only@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: user_document_chunks_v2
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: mock
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      JWT_SECRET_KEY: e2e-secret-key-that-is-long-enough-0123456789
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: ${AUTH_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      STORAGE_ROOT: /data/uploads
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.75}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      SENSITIVE_FIELD_CONCEPTS: ${SENSITIVE_FIELD_CONCEPTS:-identity.passport_number,identity.pan_number,identity.aadhaar_number,identity.national_id,financial.account_number,financial.routing_number,financial.tax_id,financial.cif_number}
    ports:
      - "127.0.0.1:${TEST_BACKEND_PORT:-8011}:8000"
    volumes:
      - test_document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [smart-form-internal]

  worker:
    build:
      context: ./backend
      target: prod
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: test
      MONGODB_DATABASE: smart_form_test
      MONGODB_URL: mongodb://smart_form_test:local_test_only@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      STORAGE_ROOT: /data/uploads
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      JWT_SECRET_KEY: e2e-secret-key-that-is-long-enough-0123456789
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: user_document_chunks_v2
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-30}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
    volumes:
      - test_document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smart-form-internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${TEST_VITE_API_BASE_URL:-http://127.0.0.1:8011}
    environment:
      VITE_API_BASE_URL: ${TEST_VITE_API_BASE_URL:-http://127.0.0.1:8011}
      API_ORIGIN: ${TEST_VITE_API_BASE_URL:-http://127.0.0.1:8011}
    ports:
      - "127.0.0.1:${TEST_FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  extension-builder:
    build:
      context: ./extension
    volumes:
      - ./extension/dist:/app/dist

networks:
  smart-form-internal:
    driver: bridge

volumes:
  test_mongodb_data:
  test_chromadb_data:
  test_redis_data:
  test_document_data:
