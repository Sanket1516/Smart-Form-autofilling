name: CI

on:
  push:
  pull_request:

jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chromadb:
        image: chromadb/chroma
        ports:
          - 8001:8000
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-only-secret-key-never-used-outside-tests-123456
      LLM_PROVIDER: mock
      MONGODB_URL: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: smart_form_ci
      CHROMADB_URL: http://127.0.0.1:8001
      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend tests
      - run: python -m black --check backend tests
      - run: python -m pytest
      - name: Wait for ChromaDB
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8001/api/v2/heartbeat"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(2)
          else:
              raise RuntimeError("ChromaDB did not become ready within 60 seconds")
          PY
      - run: python -m pytest -o addopts="" -m chroma
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f docker-compose.test.yml config --quiet

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx --prefix extension playwright install --with-deps chromium
      - run: make test-e2e
