name: smart-form-autofilling-dev

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-smart_form}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-local_development_only}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval ''db.adminCommand("ping").ok'' | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [smart-form-internal]

  chromadb:
    image: chromadb/chroma
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    volumes:
      - chromadb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [smart-form-internal]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  backend:
    build:
      context: ./backend
      target: ${BACKEND_BUILD_TARGET:-prod}
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Smart Form Auto-Filling System}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_form_db}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-smart_form}:${MONGODB_ROOT_PASSWORD:-local_development_only}@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: ${CHROMADB_COLLECTION:-user_document_chunks_v2}
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_PREPROCESS: ${OCR_PREPROCESS:-auto}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique 32+ character JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: ${AUTH_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      STORAGE_ROOT: /data/uploads
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.75}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      SENSITIVE_FIELD_CONCEPTS: ${SENSITIVE_FIELD_CONCEPTS:-identity.passport_number,identity.pan_number,identity.aadhaar_number,identity.national_id,financial.account_number,financial.routing_number,financial.tax_id,financial.cif_number}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # A container that runs out of memory is restarted on its own instead of
    # exhausting the Docker VM (which stops the whole engine).
    mem_limit: 2500m
    restart: unless-stopped
    networks: [smart-form-internal]

  worker:
    build:
      context: ./backend
      target: ${BACKEND_BUILD_TARGET:-prod}
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
        "--max-tasks-per-child=25",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_form_db}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-smart_form}:${MONGODB_ROOT_PASSWORD:-local_development_only}@mongodb:27017/?authSource=admin
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-1500}
      STORAGE_ROOT: /data/uploads
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-2}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_RESOLUTION: ${OCR_RESOLUTION:-150}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: ${OCR_CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: "1"
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_COLLECTION: ${CHROMADB_COLLECTION:-user_document_chunks_v2}
      CHROMADB_TENANT: ${CHROMADB_TENANT:-default_tenant}
      CHROMADB_DATABASE: ${CHROMADB_DATABASE:-default_database}
      CHROMADB_TIMEOUT_SECONDS: ${CHROMADB_TIMEOUT_SECONDS:-30}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique 32+ character JWT_SECRET_KEY in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_PREPROCESS: ${OCR_PREPROCESS:-auto}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - document_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A container that runs out of memory is restarted on its own instead of
    # exhausting the Docker VM (which stops the whole engine).
    mem_limit: 3500m
    restart: unless-stopped
    networks: [smart-form-internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      API_ORIGIN: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-form-internal]

  extension-builder:
    build:
      context: ./extension
    volumes:
      - ./extension/dist:/app/dist

networks:
  smart-form-internal:
    driver: bridge

volumes:
  mongodb_data:
  chromadb_data:
  redis_data:
  document_data:
