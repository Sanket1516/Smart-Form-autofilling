# Concepts for application forms that ask about the candidate themselves (graduate / internship
# applications): technical background, open questions and job preferences.
#
# answer_only: true marks open questions. They are classified like any other field, but are never
# stored as profile facts: the answer is written at fill time from retrieved document text and must
# quote it (see agents/graph.py). Concepts that end in .summary / .objective are treated as prose.
concepts:
  personal.current_location:
    canonical_name: personal.current_location
    description: Current city, state and country where the candidate is based
    aliases:
    - current location
    - present location
    - current city
    - where are you based
    data_type: string
    cardinality: single
    is_structured: true
  skills.tools:
    canonical_name: skills.tools
    description: Developer tools and platforms such as Git, GitHub, Docker or Postman
    aliases:
    - tools and platforms
    - developer tools
    - tools platforms
    data_type: string
    cardinality: single
    is_structured: true
  preferences.job_role:
